name: Release tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine la version a taguer
        id: version
        run: echo "version=$(node scripts/extract-latest-version.cjs)" >> "$GITHUB_OUTPUT"

      - name: Cree et pousse le tag (le push d'un tag n'est pas bloque par la protection de la branche main)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Le tag v$VERSION existe deja, rien a faire."
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi
